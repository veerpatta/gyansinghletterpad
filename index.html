<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d2b6b">
<meta name="description" content="ज्ञानेन्द्रसिंह चुण्डावत — ब्लॉक कांग्रेस कमेटी आमेट. बोलकर पत्र लिखें, एक टैप में PDF बनाएँ.">
<title>लेटरपैड — ब्लॉक कांग्रेस कमेटी आमेट</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ══════════════ TOP BAR ══════════════ -->
<header class="topbar" id="topbar">
  <button class="topbar__btn" id="btnNew" data-i18n-al="btn.new">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div class="topbar__title">
    <strong id="topTitle">नया पत्र</strong>
    <small id="topSub">ब्लॉक कांग्रेस कमेटी आमेट</small>
  </div>
  <button class="topbar__btn" id="btnSettings" data-i18n-al="btn.settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="main">

  <!-- ══════════════ TAB 1 · लिखें ══════════════ -->
  <section class="tab is-active" id="tab-write" role="tabpanel">
    <div class="scroll" id="writeScroll">

      <!-- letter language: prominent, because it changes per letter -->
      <div class="card card--lang">
        <span class="field__lbl" data-i18n="lang.letter">पत्र की भाषा</span>
        <div class="seg" id="segLang" role="group">
          <button type="button" class="seg__b is-on" data-lang="hi">हिन्दी</button>
          <button type="button" class="seg__b" data-lang="en">English</button>
        </div>
      </div>

      <div class="card row2">
        <label class="field">
          <span class="field__lbl" data-i18n="field.ref">क्रमांक</span>
          <input id="fKramank" type="text" inputmode="text" autocomplete="off">
        </label>
        <label class="field">
          <span class="field__lbl" data-i18n="field.date">दिनांक</span>
          <input id="fDinank" type="text" inputmode="text" autocomplete="off">
        </label>
      </div>

      <div class="card">
        <label class="field">
          <span class="field__lbl" data-i18n="field.to">सेवा में — श्रीमान</span>
          <textarea id="fTo" rows="1" data-i18n-ph="ph.to"></textarea>
        </label>
        <div class="chips" id="bookChips"></div>
      </div>

      <div class="card" id="subjectCard" hidden>
        <label class="field">
          <span class="field__lbl" data-i18n="field.subject">विषय</span>
          <textarea id="fSubject" rows="1" data-i18n-ph="ph.subject"></textarea>
        </label>
      </div>

      <div class="card">
        <div class="field__lbl field__lbl--bar">
          <span data-i18n="field.body">मुख्य भाग</span>
          <span class="toolbtns">
            <button type="button" class="tool" id="btnUndo" data-i18n="btn.undo">↶ वापस</button>
            <button type="button" class="tool" id="btnBullet" data-i18n="btn.point">• बिंदु</button>
            <button type="button" class="tool" id="btnPara" data-i18n="btn.para">¶ पैरा</button>
          </span>
        </div>
        <textarea id="fBody" rows="8" data-i18n-ph="ph.body"></textarea>
        <div class="chips" id="snipChips"></div>
      </div>

      <div class="card">
        <label class="switch">
          <input type="checkbox" id="fShowCc" checked>
          <span data-i18n="field.cc">सूचनार्थ प्रेषित</span>
        </label>
        <textarea id="fCc" rows="2" data-i18n-ph="ph.cc"></textarea>
      </div>

      <div class="card card--flat">
        <label class="switch">
          <input type="checkbox" id="fFit" checked>
          <span data-i18n="btn.fit">एक पेज में फ़िट करें</span>
        </label>
        <div class="row2">
          <!-- label flips add/remove, so fillForm() owns its text, not applyI18n -->
          <button type="button" class="btn btn--ghost" id="btnSubject">विषय जोड़ें</button>
          <button type="button" class="btn btn--ghost" id="btnTemplates" data-i18n="btn.templates">टेम्पलेट</button>
        </div>
      </div>

      <div class="spacer-lg"></div>
    </div>

    <div class="micbar" id="micbar">
      <button class="mic" id="btnMic" data-i18n-al="mic.idle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg>
      </button>
      <div class="micbar__txt">
        <strong id="micState" data-i18n="mic.idle">बोलकर लिखें</strong>
        <small id="micTarget"></small>
      </div>
      <button class="micbar__q" id="btnVoiceHelp" data-i18n-al="btn.help">?</button>
    </div>
  </section>

  <!-- ══════════════ TAB 2 · देखें ══════════════ -->
  <section class="tab" id="tab-view" role="tabpanel">
    <div class="stagewrap" id="stagewrap">
      <div class="stage" id="stage"><div id="sheet"></div></div>
    </div>
    <div class="viewbar">
      <span class="pill" id="pagePill">पेज 1</span>
      <div class="viewbar__acts">
        <button class="btn btn--primary" id="btnPdf" data-i18n="btn.pdf">PDF</button>
        <button class="btn" id="btnShare" data-i18n="btn.send">भेजें</button>
        <button class="btn" id="btnPrint" data-i18n="btn.print">प्रिंट</button>
      </div>
    </div>
  </section>

  <!-- ══════════════ TAB 3 · पत्र ══════════════ -->
  <section class="tab" id="tab-list" role="tabpanel">
    <div class="scroll">
      <div class="listhead">
        <span id="listCount"></span>
        <button class="btn btn--sm btn--ghost" id="btnBackup" data-i18n="btn.backup">बैकअप</button>
      </div>
      <div id="letterList"></div>
      <div class="spacer-lg"></div>
    </div>
  </section>

</main>

<!-- ══════════════ TAB BAR ══════════════ -->
<nav class="tabbar" id="tabbar" role="tablist">
  <button class="tabbtn is-active" data-tab="write" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span data-i18n="tab.write">लिखें</span>
  </button>
  <button class="tabbtn" data-tab="view" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span data-i18n="tab.view">देखें</span>
  </button>
  <button class="tabbtn" data-tab="list" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
    <span data-i18n="tab.list">पत्र</span>
  </button>
</nav>

<!-- ══════════════ DIALOGS ══════════════ -->
<dialog class="sheetdlg" id="dlgSettings">
  <form method="dialog" class="sheetdlg__hd">
    <strong data-i18n="set.title">सेटिंग</strong><button class="x" data-i18n-al="btn.close">✕</button>
  </form>
  <div class="sheetdlg__bd">

    <h4 data-i18n="lang.app">ऐप की भाषा</h4>
    <div class="seg seg--wide" id="segUI" role="group">
      <button type="button" class="seg__b is-on" data-ui="hi">हिन्दी</button>
      <button type="button" class="seg__b" data-ui="en">English</button>
    </div>

    <h4 data-i18n="set.head">लेटरहेड</h4>
    <p class="hint" data-i18n="set.headHint"></p>
    <div class="row2">
      <label class="btn btn--ghost btn--wide"><span data-i18n="set.headPick">हेडर चुनें</span><input type="file" id="fHeader" accept="image/*" hidden></label>
      <button class="btn btn--ghost" id="btnHeaderReset" data-i18n="set.headDrop">हटाएँ</button>
    </div>
    <label class="field"><span class="field__lbl" data-i18n="set.headH">हेडर की ऊँचाई (मिमी)</span>
      <input id="fHeaderH" type="number" min="20" max="90" step="1"></label>

    <h4 data-i18n="set.pdf">PDF</h4>
    <label class="switch"><input type="checkbox" id="fHiQ" checked><span data-i18n="set.hiQ"></span></label>
    <label class="switch"><input type="checkbox" id="fDevDigits"><span data-i18n="set.devDigits"></span></label>

    <h4 data-i18n="set.book">पता‑पुस्तिका</h4>
    <p class="hint" data-i18n="set.bookHint"></p>
    <textarea id="fBook" rows="4"></textarea>

    <h4 data-i18n="set.dict">शब्द‑सुधार</h4>
    <p class="hint" data-i18n-html="set.dictHint"></p>
    <textarea id="fDict" rows="6"></textarea>

    <h4 data-i18n="set.backup">बैकअप</h4>
    <div class="row2">
      <button class="btn btn--ghost" id="btnExport" data-i18n="set.export">निर्यात</button>
      <label class="btn btn--ghost btn--wide"><span data-i18n="set.import">आयात</span><input type="file" id="fImport" accept="application/json" hidden></label>
    </div>

    <p class="hint hint--foot"><span data-i18n="set.foot"></span> <span id="verLbl"></span></p>
  </div>
</dialog>

<dialog class="sheetdlg" id="dlgTemplates">
  <form method="dialog" class="sheetdlg__hd">
    <strong data-i18n="tpl.title">टेम्पलेट</strong><button class="x" data-i18n-al="btn.close">✕</button>
  </form>
  <div class="sheetdlg__bd" id="tplList"></div>
</dialog>

<dialog class="sheetdlg" id="dlgVoice">
  <form method="dialog" class="sheetdlg__hd">
    <strong data-i18n="help.title">बोलकर लिखने के आदेश</strong><button class="x" data-i18n-al="btn.close">✕</button>
  </form>
  <div class="sheetdlg__bd">
    <p class="hint" data-i18n="help.intro"></p>
    <table class="cmdtbl" id="cmdTbl"></table>
    <p class="hint hint--foot" data-i18n="help.tip"></p>
  </div>
</dialog>

<!-- first run: pick a language, then two cards explaining the whole app -->
<dialog class="tourdlg" id="dlgTour">
  <div class="tour" id="tourBody"></div>
  <div class="tour__nav">
    <button type="button" class="btn btn--ghost btn--sm" id="tourSkip" data-i18n="tour.skip">छोड़ें</button>
    <span class="tour__dots" id="tourDots"></span>
    <button type="button" class="btn btn--primary" id="tourNext" data-i18n="btn.next">आगे</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div class="busy__box"><div class="spin"></div><span id="busyTxt"></span></div></div>
<button class="installbtn" id="btnInstall" hidden data-i18n="btn.install"></button>

<div id="capture" aria-hidden="true"></div>

<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
